name: Deploy

# Manual only: Actions → "Deploy" → Run workflow → pick the branch and the environment.
#   dev  → codebrew-development, https://cards.steeping.studio (any branch)
#   prod → codebrew-production,  https://cards.codebrew.studio (main only)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # explicit bash adds -o pipefail, so `script | tee` fails when the script fails

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Production deploys only from main
        if: inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production can only be deployed from main (got ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Settings are secrets in the GitHub Environment (masked in logs), not in the repo.
    # Protect "prod" with required reviewers and a main-only branch rule in the repo settings.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # lets GitHub issue the token Google exchanges for short-lived credentials
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
    steps:
      - name: Check configuration
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
        run: |
          missing=()
          [[ -n "$PROJECT_ID" ]] || missing+=(GCP_PROJECT_ID)
          [[ -n "$WIF_PROVIDER" ]] || missing+=(GCP_WIF_PROVIDER)
          [[ -n "$DEPLOY_SA" ]] || missing+=(GCP_DEPLOY_SA)
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets in the '${ENVIRONMENT}' environment: ${missing[*]}. Run ENVIRONMENT=${ENVIRONMENT} scripts/setup-github-deploy.sh and see the README."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/cards/app:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          ./scripts/deploy-cloudrun.sh | tee deploy.log
          case "$ENVIRONMENT" in
            prod) url="https://cards.codebrew.studio" ;;
            *) url="https://cards.steeping.studio" ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed \`${GITHUB_SHA::7}\` to ${ENVIRONMENT}: $url (Cloud Run: $(tail -n 1 deploy.log))" >> "$GITHUB_STEP_SUMMARY"
